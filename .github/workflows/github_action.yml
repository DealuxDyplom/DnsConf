name: DNS Block&Redirect Configurer cron task

on:
  schedule:
    - cron: '30 1 * * *' # 04:30 MSK (01:30 UTC)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: DNS

    env:
      DNS: ${{ vars.DNS }}
      BLOCK: ${{ vars.BLOCK }}
      REDIRECT: ${{ vars.REDIRECT }}
      EXCLUDE_REDIRECT: ${{ vars.EXCLUDE_REDIRECT }}

      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}

      TZ: Europe/Moscow

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Debug DNSConf variables
        run: |
          echo "DNS=$DNS"
          echo "REDIRECT=$REDIRECT"
          echo "BLOCK=$BLOCK"
          echo "EXCLUDE_REDIRECT=$EXCLUDE_REDIRECT"

      - name: Debug redirect source
        run: |
          echo "REDIRECT=$REDIRECT"
          curl -L "$REDIRECT" -o redirect_source.hosts

          echo "First 20 lines:"
          head -n 20 redirect_source.hosts

          echo
          echo "Lines with oaiusercontent:"
          grep -niE 'oaiusercontent|files\.oaiusercontent' redirect_source.hosts || true

          echo
          echo "Suspicious lines with only one token:"
          awk 'NF==1 && $0 !~ /^#/ && $0 !~ /^[[:space:]]*$/ {print NR ": " $0}' redirect_source.hosts || true

      - name: Check EXCLUDE_REDIRECT contains required domain
        run: |
          echo "$EXCLUDE_REDIRECT" | tr ',' '\n' | grep -Fx "files.oaiusercontent.com" \
            && echo "OK: files.oaiusercontent.com is in EXCLUDE_REDIRECT" \
            || (echo "ERROR: files.oaiusercontent.com is NOT in EXCLUDE_REDIRECT" && exit 1)

      - name: Run application
        run: |
          echo "Starting application..."
          java --enable-preview -jar target/*.jar
